# The stack this interpreter needs, said where the compiler reads it (Q-168).
# The evaluator recurses on the C stack -- about 35 KB per Ruby call -- and a
# Fiber's body runs on a coroutine of its own, which gets this same size
# (mere v0.1.543). Before, the only request was a link flag in tools/build.sh,
# which reaches the main thread and nothing else.
[package]
name = "mere-ruby"
version = "0.0.0"
stack = "512MB"
mere = ">= 0.1.644"
