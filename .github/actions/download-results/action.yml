name: Download measurement results
description: Retry transient artifact download failures before collecting every planned file
inputs:
  pattern:
    description: Artifact name pattern from this workflow run
    required: true
  path:
    description: Destination for the artifact directories
    required: true
runs:
  using: composite
  steps:
    - id: first
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
    - if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - id: second
      if: ${{ steps.first.outcome == 'failure' }}
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
    - if: ${{ steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 30
    - if: ${{ steps.second.outcome == 'failure' }}
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
