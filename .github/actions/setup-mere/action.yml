name: Set up the pinned Mere compiler
description: Reuse the native compiler for the exact source and runner toolchain
inputs:
  ref:
    description: Full published Mere commit SHA
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: merelang/mere
        ref: ${{ inputs.ref }}
        path: .mere-compiler
        persist-credentials: false
    - id: native
      shell: bash
      run: |
        fingerprint=$(
          {
            printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -sm
            clang --version
          } | shasum -a 256 | cut -d ' ' -f 1
        )
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: compiler
      with:
        path: .mere-compiler/_build/default/bin/mere.exe
        key: mere-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ref }}-${{ steps.native.outputs.fingerprint }}-${{ hashFiles('.github/actions/setup-mere/action.yml') }}
    # A cached native OCaml executable needs no opam switch to run. On a miss,
    # retain the bounded retry for transient OCaml release download failures.
    - uses: ocaml/setup-ocaml@v3
      id: ocaml
      if: steps.compiler.outputs.cache-hit != 'true'
      continue-on-error: true
      with:
        ocaml-compiler: "5.1"
    - uses: ocaml/setup-ocaml@v3
      if: steps.compiler.outputs.cache-hit != 'true' && steps.ocaml.outcome == 'failure'
      with:
        ocaml-compiler: "5.1"
    - name: Build the pinned Mere compiler
      if: steps.compiler.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .mere-compiler
      run: |
        opam install . --deps-only
        opam exec -- dune build bin/mere.exe
    - name: Verify the compiler executable
      shell: bash
      run: |
        test -x .mere-compiler/_build/default/bin/mere.exe
        .mere-compiler/_build/default/bin/mere.exe --version
    # Save immediately so later test failures do not discard a valid compiler.
    - uses: actions/cache/save@v4
      if: steps.compiler.outputs.cache-hit != 'true'
      with:
        path: .mere-compiler/_build/default/bin/mere.exe
        key: ${{ steps.compiler.outputs.cache-primary-key }}
