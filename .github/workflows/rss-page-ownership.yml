name: RSS page ownership

on:
  pull_request:
    paths:
      - .github/workflows/rss-page-ownership.yml
      - tools/rss_page_observer.c
      - tools/rss_page_probe.py
      - tools/rss_page_probe_check.py
      - tools/fixtures/rss_page_sample.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-page-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  SUBJECT_REF: 90c83c6e525fbac7c7b9cdf670bd5e6db1ca79a5
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238

jobs:
  page-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - 43f2994b7d2bc664e47afa1c9555f2dcf26214f2
          - 408b03d9cfc9f56331490a8912f3ea1254d488dd
    env:
      MERE_REF: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check page-reader evidence and negative controls
        run: python3 tools/rss_page_probe_check.py -v
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_REF }}
          path: subject
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: Check real Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build the locked compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - uses: actions/cache@v4
        with:
          path: subject/vendor/prism/obj
          key: rss-page-prism-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('subject/vendor/prism/src/**/*.c', 'subject/vendor/prism/include/**/*.h') }}
      - name: Build the ordinary locked runtime
        working-directory: subject
        run: |
          ruby tools/gen_prism_lib.rb > m_prism_lib.mere
          MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" sh tools/build.sh
      - name: Build the separate read-only page observer
        run: |
          python3 tools/rss_page_probe.py build --subject "$GITHUB_WORKSPACE/subject" \
            --subject-ref "$SUBJECT_REF" --diagnostic-root "$RUNNER_TEMP/page-observer"
      - name: Retain ordinary gates and collect page evidence
        run: |
          ulimit -s 524288
          python3 tools/rss_page_probe.py collect --subject "$GITHUB_WORKSPACE/subject" \
            --subject-ref "$SUBJECT_REF" --diagnostic-root "$RUNNER_TEMP/page-observer" \
            --compiler-root "$GITHUB_WORKSPACE/.mere-compiler" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" --output "$RUNNER_TEMP/page-results"
      - name: Retain failed and completed measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-page-native-${{ matrix.compiler }}
          path: |
            ${{ runner.temp }}/page-results
            ${{ runner.temp }}/page-observer/probe-build.log
            ${{ runner.temp }}/page-observer/probe-build.json
          retention-days: 7
          if-no-files-found: warn
