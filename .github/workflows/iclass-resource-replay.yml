name: Original iclass resource replay

on:
  pull_request:
    paths:
      - .github/workflows/iclass-resource-replay.yml
      - tools/iclass_resource_replay.py
      - tools/iclass_resource_assess.py
      - tools/iclass_resource_replay_check.py
      - bench/iclass_resource_r88.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iclass-resource-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_REF: c22ad34649707cbcf58105d60401c6417cece828
  BEFORE_COMPILER: 43f2994b7d2bc664e47afa1c9555f2dcf26214f2
  REPAIR_COMPILER: 408b03d9cfc9f56331490a8912f3ea1254d488dd
  RUBY_SOURCE_REF: a704b7cd95a42cc0cf5f307137bf3aac0285b915

jobs:
  original-iclass:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Reject altered inputs and waived resource failures
        run: python3 tools/iclass_resource_replay_check.py -v
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: before
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: repair
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.BEFORE_COMPILER }}
          path: compiler-before
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.REPAIR_COMPILER }}
          path: compiler-repair
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
      - name: Check Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build both immutable compilers
        run: |
          for side in before repair; do
            (cd "compiler-$side" && opam install . --deps-only && opam exec -- dune build bin/mere.exe)
          done
      - name: Build the same failed source at ordinary O2
        run: |
          for side in before repair; do
            (cd "$side" && ruby tools/gen_prism_lib.rb > m_prism_lib.mere && \
              MERE="$GITHUB_WORKSPACE/compiler-$side/_build/default/bin/mere.exe" sh tools/build.sh)
          done
      - name: Compare the original iclass case without changing its ten-second bound
        run: |
          ulimit -s 524288
          python3 tools/iclass_resource_replay.py \
            --before "$GITHUB_WORKSPACE/before" --repair "$GITHUB_WORKSPACE/repair" \
            --before-compiler "$GITHUB_WORKSPACE/compiler-before" \
            --repair-compiler "$GITHUB_WORKSPACE/compiler-repair" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" --output "$RUNNER_TEMP/iclass-replay"
      - name: Retain every trial and original child input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-iclass-native
          path: ${{ runner.temp }}/iclass-replay
          retention-days: 7
          if-no-files-found: warn
