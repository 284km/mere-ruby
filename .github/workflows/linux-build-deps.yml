name: Linux build dependency controls

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: LANG=en_US.UTF-8 python3 tools/linux_build_deps_check.py -v
