name: Clone RSS heap investigation

on:
  pull_request:
    paths:
      - .github/workflows/clone-rss-heap.yml
      - tools/clone_rss_heap.py
      - tools/rss_heap_observer.py
      - tools/rss_heap_observer.c
      - tools/rss_native_probe.py
      - tools/clone_rss_heap_check.py
      - tools/fixtures/clone_heap_sample.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clone-rss-heap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238

jobs:
  heap-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MERE_REF: 01f5ad738748cc570cc04e3000f50b8c6965543f
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check native observation acceptance
        run: |
          python3 tools/rss_native_probe_check.py -v
          python3 tools/clone_rss_heap_check.py -v
      - uses: actions/checkout@v5
        with:
          ref: ae6bd8cc89a98fc01a1e129d3becc447b637d35f
          path: subject
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: Check real Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: '5.1'
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build the pinned compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the ordinary locked subject
        working-directory: subject
        run: |
          ruby tools/gen_prism_lib.rb > m_prism_lib.mere
          MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" sh tools/build.sh
      - name: Build a separate read-only heap observer
        run: |
          python3 tools/clone_rss_heap.py build --subject "$GITHUB_WORKSPACE/subject" \
            --diagnostic-root "$RUNNER_TEMP/clone-heap-observer"
      - name: Run the locked failing source and fixed clone observations
        run: |
          ulimit -s 524288
          python3 tools/clone_rss_heap.py collect --subject "$GITHUB_WORKSPACE/subject" \
            --diagnostic-root "$RUNNER_TEMP/clone-heap-observer" \
            --compiler-root "$GITHUB_WORKSPACE/.mere-compiler" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" --output "$RUNNER_TEMP/clone-heap-results"
      - name: Retain all completed and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clone-heap-native
          path: |
            ${{ runner.temp }}/clone-heap-results
            ${{ runner.temp }}/clone-heap-observer/probe-build.log
            ${{ runner.temp }}/clone-heap-observer/probe-build.json
          retention-days: 7
          if-no-files-found: warn
