name: NKF Wasm engine
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch the pinned WASI SDK 34.0 archive
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Verify sources and reproduce the shipped reactor
        run: |
          python3 unittest/nkf_sources_check.py
          NKF_WASM_OUTPUT="$RUNNER_TEMP/nkf.wasm" sh tools/build_nkf_wasm.sh
          cmp docs/nkf.wasm "$RUNNER_TEMP/nkf.wasm"
      - name: Check the actual bridge under allocation failures
        run: |
          NKF_WASM_TEST=1 NKF_WASM_OUTPUT="$RUNNER_TEMP/nkf-fault.wasm" sh tools/build_nkf_wasm.sh
          node unittest/nkf_wasm_boundary.mjs "$RUNNER_TEMP/nkf-fault.wasm"
