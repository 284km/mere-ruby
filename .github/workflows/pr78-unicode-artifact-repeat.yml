name: PR78 Unicode artifact repeat

on:
  push:
    branches: [ci/pr78-unicode-artifact-repeat-20261111]

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  REF_RUBY_VERSION: "4.0.9"
  RUST_VERSION: "1.85.0"

jobs:
  unicode-repeat:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b8d9a8aebec7d395877373f9008ef2e5a1c19c46
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: 3e93b23afcec3433f6aecc34b5d832799d754238
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
          run-id: 42998912377
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
          run-id: 42998912377
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
          run-id: 42998912377
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the exact published binaries and test data
        run: |
          brew install openssl@3 libyaml
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          echo "$GITHUB_WORKSPACE/.reference-ruby/bin" >> "$GITHUB_PATH"
          echo "REF_RUBY_BIN=$GITHUB_WORKSPACE/.reference-ruby/bin/ruby" >> "$GITHUB_ENV"
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Restore the original pinned Rust environment
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rust_bin=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          echo "UNITTEST_RUST_BIN=$rust_bin" >> "$GITHUB_ENV"
      - name: Verify provenance and select the unchanged Unicode file
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path(".")
          build = json.loads((root / "build-info.json").read_text())
          original = json.loads((root / "measurement-plan/manifest.json").read_text())
          assert build["binary_sha256"] == hashlib.sha256((root / "mere-ruby").read_bytes()).hexdigest()
          assert build["binary_sha256"] == "13c6443f27440a5cac2db7e4a184da715814140f42a68af1e2edeb0c4bd66a01"
          assert build["source_ref"] == original["source_ref"] == "b8d9a8aebec7d395877373f9008ef2e5a1c19c46"
          assert build["mere_ref"] == original["mere_ref"] == "b92d73358e77a1577400c83aff7d61ea886984f9"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == "b8d9a8aebec7d395877373f9008ef2e5a1c19c46"
          assert subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == "6b97e7dd93b790e9c3c0cce9eb51fc057ef215cd"
          assert original["shards"] == 8 and len(original["files"]) == 758
          target = "ruby/enc/test_case_comprehensive.rb"
          assert target in original["files"]
          focused = dict(original, files=[target], partitions=[[target]], shards=1)
          (root / "unicode-repeat-plan.json").write_text(json.dumps(focused, indent=2) + "\n")
          PY
      - name: Repeat every Unicode assertion within original limits
        run: |
          ulimit -c 0
          python3 unittest/ci.py run --ruby-src .ruby-tests \
            --plan unicode-repeat-plan.json --build-info build-info.json \
            --reference-info reference-build.json --shard 0 \
            --output unicode-repeat/shard-0 --wall 600 --rss-kb 2097152
      - name: Require a complete matching 422-test result
        run: |
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path("unicode-repeat/shard-0/result.json").read_text())
          assert result["binary_sha256"] == "13c6443f27440a5cac2db7e4a184da715814140f42a68af1e2edeb0c4bd66a01"
          assert not result["infrastructure_error"]
          assert result["bounds"]["wall_per_side"] == 600
          assert result["bounds"]["rss_family_kb"] == 2097152
          assert len(result["rows"]) == 1
          row = result["rows"][0]
          assert row["ref_state"] == row["mere_state"] == "COMPLETE"
          assert row["tests"] == row["match"] == 422
          assert row["red"] == row["both"] == row["extra"] == 0
          assert row["mere_summary"] == dict(tests=422, assertions=2901771, failures=0, errors=0, skips=0)
          assert not row["ref_parse_issues"] and not row["mere_parse_issues"]
          assert row["execution"]["exit"] == 0 and row["execution"]["limit"] is None
          assert row["execution"]["seconds"] <= 600
          assert row["execution"]["peak_rss_kb"] <= 2097152
          print(json.dumps(row, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr78-unicode-artifact-repeat
          path: |
            unicode-repeat
            unicode-repeat-plan.json
            build-info.json
            reference-build.json
          if-no-files-found: error
          retention-days: 7
