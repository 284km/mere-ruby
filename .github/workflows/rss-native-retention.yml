name: Native RSS retention investigation

on:
  pull_request:
    paths:
      - .github/workflows/rss-native-retention.yml
      - tools/rss_native_probe.py
      - tools/rss_native_observer.c
      - tools/rss_probe_observer.rb
      - tools/rss_native_probe_check.py
      - tools/fixtures/rss_native_sample.json
      - tools/fixtures/method_floor_policy.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-native-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep both existing CI pins. Updating a pin is not a memory repair.
        mere:
          - 2e3cc433d470842a07c79cc50bd217441c889dc0
          - 01f5ad738748cc570cc04e3000f50b8c6965543f
    env:
      MERE_REF: ${{ matrix.mere }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check native observation acceptance
        run: python3 tools/rss_native_probe_check.py -v
      - uses: actions/checkout@v5
        with:
          ref: 90c83c6e525fbac7c7b9cdf670bd5e6db1ca79a5
          path: subject
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: Check real Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: '5.1'
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build the pinned compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the ordinary locked subject
        working-directory: subject
        run: |
          ruby tools/gen_prism_lib.rb > m_prism_lib.mere
          MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" sh tools/build.sh
      - name: Build a separate read-only native observer
        run: |
          python3 tools/rss_native_probe.py build --subject "$GITHUB_WORKSPACE/subject" \
            --diagnostic-root "$RUNNER_TEMP/rss-native-observer"
      - name: Run unchanged gates and separate ownership diagnostics
        run: |
          ulimit -s 524288
          python3 tools/rss_native_probe.py collect --subject "$GITHUB_WORKSPACE/subject" \
            --diagnostic-root "$RUNNER_TEMP/rss-native-observer" \
            --compiler-root "$GITHUB_WORKSPACE/.mere-compiler" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" --output "$RUNNER_TEMP/rss-native-results"
      - name: Retain all completed and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rss-${{ matrix.mere }}
          path: |
            ${{ runner.temp }}/rss-native-results
            ${{ runner.temp }}/rss-native-observer/probe-build.log
            ${{ runner.temp }}/rss-native-observer/probe-build.json
          retention-days: 7
          if-no-files-found: warn
