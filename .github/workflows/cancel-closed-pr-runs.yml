name: Cancel runs of a closed PR

# A run keeps its place in the queue after its PR is closed or merged, and the
# per-PR concurrency groups only cancel a run when a newer one for the same PR
# starts. On 2026-11-23, 54 of 87 queued runs belonged to branches whose PRs
# were already closed, and they held the scarce macOS runners ahead of open PRs.
on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued and running workflow runs of this PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: ${{ github.run_id }}
        run: |
          for status in queued in_progress waiting pending; do
            gh run list --repo "$REPO" --branch "$BRANCH" --status "$status" \
              --limit 200 --json databaseId --jq '.[].databaseId'
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            gh run cancel "$id" --repo "$REPO" || true
          done
