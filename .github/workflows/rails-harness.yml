name: Rails measurement harness

on:
  pull_request:
    paths:
      - 'railstest/**'
      - 'unittest/ci.py'
      - 'unittest/process_family.py'
      - '.github/workflows/rails-harness.yml'
  push:
    branches: [main]
    paths:
      - 'railstest/**'
      - 'unittest/ci.py'
      - 'unittest/process_family.py'
      - '.github/workflows/rails-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: en_US.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - run: python3 railstest/check.py -v
      - run: python3 railstest/framework/check.py -v
