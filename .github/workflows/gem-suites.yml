name: Gem suites

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gem-suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  MERE_REF: 2e3cc433d470842a07c79cc50bd217441c889dc0
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  REF_RUBY_VERSION: "4.0.9"

jobs:
  gem-suites:
    name: Upstream gem tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-suites
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sh tools/linux_build_deps.sh
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: "5.1"
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build mere-ruby with O2
        run: sh tools/build.sh
      - name: Check classification and coverage negative controls
        run: python3 gemtest/suites_check.py -v
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gem-suites-v1
          key: gem-suites-v1-${{ runner.os }}-${{ env.REF_RUBY_VERSION }}-${{ hashFiles('gemtest/suites.lock.json') }}
      - name: Restore and verify locked upstream sources and pure Ruby dependencies
        run: |
          python3 gemtest/suites.py restore --cache "$RUNNER_TEMP/gem-suites-v1" \
            --reference "$(command -v ruby)"
      - name: Measure original test files without retrieving sources
        run: |
          ulimit -c 0
          if [ "$RUNNER_OS" = Linux ]; then ulimit -s 524288; fi
          baseline=gemtest/suites_latest.json
          if [ "$RUNNER_OS" = Linux ]; then baseline=gemtest/suites_linux.json; fi
          python3 gemtest/suites.py measure --cache "$RUNNER_TEMP/gem-suites-v1" \
            --reference "$(command -v ruby)" --binary ./mere-ruby \
            --ruby-src .ruby-suites --output gem-suites-report \
            --baseline "$baseline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gem-suites-${{ runner.os }}
          path: gem-suites-report
          if-no-files-found: warn
          retention-days: 7
