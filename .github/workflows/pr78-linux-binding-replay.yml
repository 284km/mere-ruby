name: PR78 Linux binding resource replay

on:
  push:
    branches: [ci/pr78-linux-binding-replay-20261111]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  MERE_REF: b92d73358e77a1577400c83aff7d61ea886984f9
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  REF_RUBY_VERSION: "4.0.9"

jobs:
  module-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replay: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 37ba6de7a5f2ea10a1a2040f88b9e44ed57a5d4b
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: "5.1"
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the actual O2 interpreter
        run: sh tools/build.sh
      - name: Verify source and record binary provenance
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source == '37ba6de7a5f2ea10a1a2040f88b9e44ed57a5d4b'
          compiler=subprocess.check_output(['git','-C','.mere-compiler','rev-parse','HEAD'],text=True).strip()
          assert compiler == 'b92d73358e77a1577400c83aff7d61ea886984f9'
          assert (root/'.build_mode').read_text().strip() == 'O2'
          (root/'binding-build-info.json').write_text(json.dumps(dict(source_ref=source,mere_ref=compiler,binary_sha256=hashlib.sha256((root/'mere-ruby').read_bytes()).hexdigest(),generated_c_sha256=hashlib.sha256((root/'mr.c').read_bytes()).hexdigest(),optimization='O2'),indent=2)+'\n')
          PYTHON
      - name: Run all original Module assertions and resource bounds
        run: |
          ulimit -s 524288
          python3 tools/class_module_check.py --ruby-src .ruby-tests --output module-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr78-linux-binding-${{ matrix.replay }}
          path: |
            module-results
            binding-build-info.json
          if-no-files-found: error
          retention-days: 7
