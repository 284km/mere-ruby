name: Linux Module RSS comparison

on:
  pull_request:
    paths:
      - .github/workflows/module-rss-comparison.yml
      - tools/module_rss_compare.py
      - tools/module_rss_observer.rb
      - tools/module_rss_compare_check.py
      - tools/fixtures/module_rss_replay.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-rss-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  MERE_REF: 43f2994b7d2bc664e47afa1c9555f2dcf26214f2
  RUBY_SOURCE_REF: a704b7cd95a42cc0cf5f307137bf3aac0285b915

jobs:
  module-rss-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check comparison acceptance with captured transcript replays
        run: python3 tools/module_rss_compare_check.py -v
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 3b05689f57dbc0321c249523eacf4863eaa7c8bf
          path: baseline
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 949e46384c1c4190be443450c3bdef0f4d822112
          path: candidate
          submodules: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.10'
      - name: Check real Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: '5.1'
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build the pinned compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build both locked sources before measuring
        run: |
          export MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe"
          (cd baseline && ruby tools/gen_prism_lib.rb > m_prism_lib.mere && sh tools/build.sh)
          (cd candidate && ruby tools/gen_prism_lib.rb > m_prism_lib.mere && sh tools/build.sh)
      - name: Compare original files and capture the unchanged memory child
        run: |
          ulimit -s 524288
          python3 tools/module_rss_compare.py \
            --baseline "$GITHUB_WORKSPACE/baseline/mere-ruby" \
            --candidate "$GITHUB_WORKSPACE/candidate/mere-ruby" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" \
            --compiler-root "$GITHUB_WORKSPACE/.mere-compiler" \
            --output "$RUNNER_TEMP/module-rss-comparison"
      - name: Retain all completed and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-rss-comparison-Linux
          path: ${{ runner.temp }}/module-rss-comparison
          retention-days: 7
          if-no-files-found: warn
