name: Cache compiler RSS comparison

on:
  pull_request:
    paths:
      - .github/workflows/cache-compiler-compare.yml
      - tools/cache_compiler_compare.py
      - tools/cache_compiler_compare_check.py
      - tools/fixtures/cache_compiler_failure.json
      - tools/method_copy_memory_check.py
      - tools/rss_native_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-compiler-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  SUBJECT_REF: 90c83c6e525fbac7c7b9cdf670bd5e6db1ca79a5
  PARENT_COMPILER: 01f5ad738748cc570cc04e3000f50b8c6965543f
  CANDIDATE_COMPILER: 94da60b51e438404edf857ed09941c5db8361dca

jobs:
  ordinary-rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check comparison acceptance
        run: python3 tools/cache_compiler_compare_check.py -v
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_REF }}
          path: before
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_REF }}
          path: repair
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.PARENT_COMPILER }}
          path: compiler-before
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.CANDIDATE_COMPILER }}
          path: compiler-repair
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: Check real Linux build dependencies
        run: sh tools/linux_build_deps.sh
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: '5.1'
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.1'
      - name: Build both locked compilers
        run: |
          for side in before repair; do
            (cd "compiler-$side" && opam install . --deps-only && opam exec -- dune build bin/mere.exe)
          done
      - name: Build ordinary O2 runtimes from the same source
        run: |
          for side in before repair; do
            (cd "$side" && ruby tools/gen_prism_lib.rb > m_prism_lib.mere &&
              MERE="$GITHUB_WORKSPACE/compiler-$side/_build/default/bin/mere.exe" sh tools/build.sh)
          done
      - name: Compare every original gate in fixed order
        run: |
          ulimit -s 524288
          python3 tools/cache_compiler_compare.py \
            --parent "$GITHUB_WORKSPACE/before" --candidate "$GITHUB_WORKSPACE/repair" \
            --parent-compiler "$GITHUB_WORKSPACE/compiler-before" \
            --candidate-compiler "$GITHUB_WORKSPACE/compiler-repair" \
            --ruby-src "$GITHUB_WORKSPACE/.ruby-source" \
            --reference "$(ruby -rrbconfig -e 'print RbConfig.ruby')" \
            --output "$RUNNER_TEMP/cache-compiler-results"
      - name: Retain successful and failed ordinary observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-compiler-native
          path: ${{ runner.temp }}/cache-compiler-results
          retention-days: 7
          if-no-files-found: warn
