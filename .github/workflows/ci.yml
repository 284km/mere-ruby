name: CI

# WHY THIS EXISTS. This repository had no CI, and neither did any of the ~36
# programs written in Mere. merelang/mere's own CI checks that its `main` still
# COMPILES this code (test/downstream/REPOS) -- but "does it still build" and
# "does it still agree with ruby" are different questions, and only the second
# one can see this repository rotting on its own.
#
# It is also the repository that found the last upstream regression: v0.1.333
# stopped `let int_max = ...` at top level from compiling, mere-ruby binds
# exactly that, and it went unnoticed into a release because the upstream gate
# only type-checked. This job is the other end of that.
#
# TWO JOBS, BECAUSE THE TWO QUESTIONS HAVE DIFFERENT RIGHT PLATFORMS.
#
# `corpus` runs on macOS. run_corpus.sh diffs mere-ruby against THE RUBY ON THE
# MACHINE, and mere-ruby reports `RUBY_PLATFORM = "arm64-darwin22"` wherever it
# runs -- its socket constants are the BSD ones to match (SOL_SOCKET 65535,
# AF_INET6 30, SO_REUSEADDR 4). On Linux the oracle is a Linux ruby, so
# corpus/108_sockets.rb compares two different platforms' answers and the
# difference is real but is not a defect. Comparing like with like means
# running where the identity it claims is true.
#
# `build-linux` compiles and smoke-runs on Linux anyway, because "does it still
# build elsewhere" is worth knowing and is what turned up three undocumented
# flags in the README's one build line.

on:
  push:
  pull_request:
  # The compiler moves daily and this repository does not, so a weekly run
  # catches the case where nothing here changed and it broke anyway.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  corpus:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # `.mere_modules/mgz` is a SUBMODULE, and checkout does not fetch those
      # by default -- so the directory was empty and `import "mgz/deflate.mere"`
      # failed. Verifying locally, where the submodule was already checked out,
      # is what hid it.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # BUILT FROM main, NOT FROM THE LATEST RELEASE. This repository is
      # developed against the compiler as it is. The cost is that a break
      # upstream reddens this repository too -- the truth of the dependency,
      # and merelang/mere's downstream_check tells the two apart from the
      # other side.
      - name: Check out the Mere compiler
        uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler

      # THE ORACLE HAS TO BE EXACTLY WHAT THE SUBJECT CLAIMS TO BE, and this
      # took three tries to get right. main.mere reports
      # `ruby 3.2.2 ... [arm64-darwin22]`, and run_corpus.sh diffs against the
      # ruby on the machine, so every axis of that string has to match:
      #
      #   platform  a Linux ruby reports SOL_SOCKET 1 where this reports 65535
      #             (BSD). Both correct for the platform each answers as.
      #   minor     3.4 put spaces around `=>` in Hash#inspect: `{"k" => nil}`
      #             against `{"k"=>nil}`.
      #   PATCH     3.2.11 stopped warning on a `$=` read; 3.2.2 still warns,
      #             and so does this. Within one minor version.
      #
      # None of the three was a defect on either side. Pinning is not a
      # workaround here -- it is what makes the diff mean anything at all.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe

      # MEASURED: 39 seconds to emit 13.3 MB of C, 25 seconds to compile it
      # into a 4.1 MB binary.
      #
      # This job is the macOS one, so the README's build line is used as
      # written: `-Wl,-stack_size` is a Mach-O option and is not optional here.
      # Parsing and evaluating recurse over the statement list, so native stack
      # use is O(program length) and a long program dies in C below the
      # interpreter's own SystemStackError guard; README "-stack_size is not
      # optional" and PAIN.md M9 have the measurement. The Linux job below
      # needs three different flags, none of which that line mentions.
      - name: Build mere-ruby
        run: |
          .mere-compiler/_build/default/bin/mere.exe -c main.mere > mr.c
          clang -O2 -w -Wl,-stack_size,0x20000000 mr.c -o mere-ruby
          ls -l mere-ruby

      # MEASURED: 42 seconds, 162/162, peak RSS 825 MB -- comfortably inside a
      # hosted runner. The gates that are NOT here are the ones the README says
      # to run alone: the mspec sweep drives this interpreter past 6 GB and one
      # spec file reaches 15.3 GB, and bootstraptest extracts a 121k-line
      # generated program. Those need their RSS guard and a machine to
      # themselves, so they are not made into a job that shares one.
      - name: run_corpus.sh — 162 programs, byte for byte against ruby
        run: ./run_corpus.sh

  # Not the corpus -- just that it still compiles and runs somewhere else. The
  # three flags below are the ones the README's build line assumes away.
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build mere-ruby on Linux
        run: |
          .mere-compiler/_build/default/bin/mere.exe -c main.mere > mr.c
          clang -O2 -w -fbracket-depth=1024 mr.c -lm -o mere-ruby
      - name: It runs
        run: |
          ulimit -s 524288
          echo 'puts [1,2,3].map { |x| x * 2 }.inspect' > /tmp/t.rb
          out=$(./mere-ruby /tmp/t.rb)
          [ "$out" = "[2, 4, 6]" ] || { echo "got [$out]"; exit 1; }
          echo "linux build runs: $out"
