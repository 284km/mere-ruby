name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unicode-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unicode-replay:
    name: Unchanged Unicode / replay ${{ matrix.replay }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replay: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve completion checker outside the runtime checkout
        run: cp unittest/unicode_completion_check.py "$RUNNER_TEMP/unicode_completion_check.py"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42933230565
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42933230565
          name: ruby-reference-macos
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42933230565
          name: unittest-plan
          path: original-plan
      - name: Restore the exact runtime source used to build the artifact
        run: |
          source_ref=$(python3 -c 'import json; print(json.load(open("build-info.json"))["source_ref"])')
          git fetch --no-tags origin "$source_ref"
          git checkout --detach "$source_ref"
          chmod +x mere-ruby
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: 3e93b23afcec3433f6aecc34b5d832799d754238
          path: .ruby-tests
          persist-credentials: false
      - name: Restore the exact reference runtime and original test extensions
        run: |
          brew install openssl@3 libyaml
          tar -xzf reference-runtime.tar.gz
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          echo "$GITHUB_WORKSPACE/.reference-ruby/bin" >> "$GITHUB_PATH"
          echo "REF_RUBY_BIN=$GITHUB_WORKSPACE/.reference-ruby/bin/ruby" >> "$GITHUB_ENV"
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Plan one unchanged file with its original source and compiler provenance
        run: |
          python3 - <<'PYPLAN'
          import json
          from pathlib import Path
          original=json.loads(Path('original-plan/manifest.json').read_text())
          file='ruby/enc/test_case_comprehensive.rb'
          assert file in original['files']
          original.update(schema=1, files=[file], shards=1)
          original.pop('partitions',None)
          original.pop('scheduling',None)
          Path('unicode-plan.json').write_text(json.dumps(original,indent=2)+'\n')
          PYPLAN
      - name: Replay all 422 Unicode cases with 600 seconds per side and 2 GiB
        run: |
          ulimit -c 0
          python3 unittest/ci.py run --ruby-src .ruby-tests \
            --plan unicode-plan.json --build-info build-info.json \
            --reference-info reference-build.json --shard 0 \
            --output unicode-replay/shard-0 --wall 600 --rss-kb 2097152
      - name: Require complete cases and all original assertions
        if: always()
        run: python3 "$RUNNER_TEMP/unicode_completion_check.py" unicode-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicode-replay-${{ matrix.replay }}
          path: |
            unicode-replay
            unicode-plan.json
            build-info.json
            reference-build.json
          if-no-files-found: error
          retention-days: 7
