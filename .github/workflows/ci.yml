name: CI

on:
  workflow_dispatch:
    inputs:
      mere_ref:
        description: Full published Mere commit SHA (default is the pinned compiler)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Imported helpers must not modify the tracked historical bytecode files.
  PYTHONDONTWRITEBYTECODE: "1"
  # Pin both dependencies so a moved result is about mere-ruby. A published
  # Mere improvement can be selected through workflow_dispatch.
  MERE_REF: ${{ inputs.mere_ref || 'e733b4c4dca461b46553820dbf8e11ea060334f2' }}
  MERE_BASE_REF: e733b4c4dca461b46553820dbf8e11ea060334f2
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  REF_RUBY_VERSION: "4.0.9"
  RUST_VERSION: "1.85.0"

jobs:
  build-linux:
    name: Matched original Module Linux comparison ${{ matrix.replay }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replay: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_BASE_REF }}
          path: .mere-baseline
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - name: Install native OpenSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config
      # Keep the same bounded setup retry as the macOS build above.
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: "5.1"
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the baseline Mere compiler
        working-directory: .mere-baseline
        run: opam exec -- dune build bin/mere.exe
      - name: Build and freeze the baseline runtime on the same runner
        run: |
          MERE="$PWD/.mere-baseline/_build/default/bin/mere.exe" sh tools/build.sh
          mkdir -p "$RUNNER_TEMP/map-baseline"
          cp mere-ruby .build_mode "$RUNNER_TEMP/map-baseline/"
          MERE_REF="$MERE_BASE_REF" python3 unittest/ci.py build-info --compiler .mere-baseline --output "$RUNNER_TEMP/map-baseline-build-info.json"
      - name: Build mere-ruby on Linux
        run: sh tools/build.sh
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-network
          persist-credentials: false
      - name: Record isolated source and compiler provenance
        run: python3 unittest/ci.py build-info --compiler .mere-compiler --output "$RUNNER_TEMP/class-build-info.json"
      - name: Check complete upstream Module tests and memory limits
        run: |
          ulimit -s 524288
          python3 tools/class_module_check.py --ruby-src .ruby-network --output "$RUNNER_TEMP/class-module"
      - name: Check baseline original Module tests on the same runner
        if: always()
        continue-on-error: true
        run: |
          ulimit -s 524288
          MERE_REF="$MERE_BASE_REF" python3 tools/class_module_check.py --ruby-src .ruby-network --binary "$RUNNER_TEMP/map-baseline/mere-ruby" --output "$RUNNER_TEMP/map-baseline-module"
      - name: Diagnostic full refinement workload (not an original gate)
        if: always()
        run: |
          ulimit -s 524288
          python3 tools/refinement_map_compare.py
      - name: Upload isolated Module results and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-map-compare-${{ runner.os }}-${{ matrix.replay }}
          path: |
            ${{ runner.temp }}/class-module
            ${{ runner.temp }}/class-build-info.json
            mere-ruby
            ${{ runner.temp }}/refinement-diagnostic.log
            ${{ runner.temp }}/map-baseline-module
            ${{ runner.temp }}/map-baseline-build-info.json
            ${{ runner.temp }}/map-baseline
            ${{ runner.temp }}/refinement-map-comparison.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
