name: CI

# WHY THIS EXISTS. This repository had no CI, and neither did any of the ~36
# programs written in Mere. merelang/mere's own CI checks that its `main` still
# COMPILES this code (test/downstream/REPOS) -- but "does it still build" and
# "does it still agree with ruby" are different questions, and only the second
# one can see this repository rotting on its own.
#
# It is also the repository that found the last upstream regression: v0.1.333
# stopped `let int_max = ...` at top level from compiling, mere-ruby binds
# exactly that, and it went unnoticed into a release because the upstream gate
# only type-checked. This job is the other end of that.

on:
  push:
  pull_request:
  # The compiler moves daily and this repository does not, so a weekly run
  # catches the case where nothing here changed and it broke anyway.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # `.mere_modules/mgz` is a SUBMODULE, and checkout does not fetch those
      # by default -- so the directory was empty and `import "mgz/deflate.mere"`
      # failed. Verifying locally, where the submodule was already checked out,
      # is what hid it.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # BUILT FROM main, NOT FROM THE LATEST RELEASE. This repository is
      # developed against the compiler as it is. The cost is that a break
      # upstream reddens this repository too -- the truth of the dependency,
      # and merelang/mere's downstream_check tells the two apart from the
      # other side.
      - name: Check out the Mere compiler
        uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe

      # MEASURED: 39 seconds to emit 13.3 MB of C, 25 seconds to compile it
      # into a 4.1 MB binary.
      #
      # `-fbracket-depth=1024` because mainline clang defaults to 256 and the
      # emitted C nests deeper than that -- Apple clang allows more, so the
      # README's build line works on the machine it was written on and not on
      # this one. The second platform-specific thing in that one line.
      #
      # NO `-Wl,-stack_size` HERE, WHICH THE README's BUILD LINE HAS. That is a
      # Mach-O option; on Linux the main thread's stack is not the linker's to
      # set, it is `ulimit -s`, which the run step below raises. The reason is
      # the same one README §"-stack_size is not optional" gives: parsing and
      # evaluating recurse over the statement list, so native stack use is
      # O(program length) and a long program dies in C below the interpreter's
      # own SystemStackError guard. PAIN.md §M9 measured 64 MB as enough to
      # change the outcome; 512 MB is what the macOS build asks for and what
      # this asks for too, so the two platforms run the same interpreter.
      - name: Build mere-ruby
        run: |
          .mere-compiler/_build/default/bin/mere.exe -c main.mere > mr.c
          clang -O2 -w -fbracket-depth=1024 mr.c -o mere-ruby
          ls -l mere-ruby

      # MEASURED: 42 seconds, 162/162, peak RSS 825 MB -- comfortably inside a
      # hosted runner. The gates that are NOT here are the ones the README says
      # to run alone: the mspec sweep drives this interpreter past 6 GB and one
      # spec file reaches 15.3 GB, and bootstraptest extracts a 121k-line
      # generated program. Those need their RSS guard and a machine to
      # themselves, so they are not made into a job that shares one.
      - name: run_corpus.sh — 162 programs, byte for byte against ruby
        run: |
          ulimit -s 524288
          ./run_corpus.sh
