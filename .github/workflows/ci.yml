name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mere_ref:
        description: Full published Mere commit SHA (default is the pinned compiler)
        type: string
        required: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin both dependencies so a moved result is about mere-ruby. A published
  # Mere improvement can be selected through workflow_dispatch.
  MERE_REF: ${{ inputs.mere_ref || '991f299b20f18639713685fe3297e087ddc5b1d7' }}
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  REF_RUBY_VERSION: "4.0.9"
  RUST_VERSION: "1.85.0"

jobs:
  unittest-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-framework
          sparse-checkout: |
            tool/lib
            bootstraptest
            basictest
            tool/test
          persist-credentials: false
      - run: python3 unittest/harness_check.py -v
      - run: python3 unittest/transcript_check.py -v
      - run: python3 unittest/test_data_check.py -v
      - run: python3 unittest/process_family_check.py -v
      - name: Test CI collection and real Test::Unit diagnostics
        run: |
          export UNITTEST_REAL_RUBY="$(ruby -rrbconfig -e 'print RbConfig.ruby')"
          export UNITTEST_REAL_TOOL_LIB="$GITHUB_WORKSPACE/.ruby-framework/tool/lib"
          python3 unittest/ci_check.py -v
          python3 unittest/reference_check.py -v
          export UNITTEST_BOOTSTRAP_RUNNER="$GITHUB_WORKSPACE/.ruby-framework/bootstraptest/runner.rb"
          test -f "$UNITTEST_BOOTSTRAP_RUNNER"
          python3 bootstraptest/measure_check.py -v
          export UNITTEST_BASIC_RUNNER="$GITHUB_WORKSPACE/.ruby-framework/basictest/runner.rb"
          test -f "$UNITTEST_BASIC_RUNNER"
          python3 basictest/measure_check.py -v
          export UNITTEST_TOOL_RUNNER="$GITHUB_WORKSPACE/.ruby-framework/tool/test/runner.rb"
          python3 tooltest/measure_check.py -v

  unittest-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - id: plan
        name: Inventory every test file and partition it once
        run: |
          python3 unittest/ci.py plan --ruby-src .ruby-tests --output measurement-plan \
            --shards 8 --timings unittest/timings.json \
            --source-ref "$GITHUB_SHA" --mere-ref "$MERE_REF" \
            --ruby-ref "$RUBY_SOURCE_REF" --ruby-version "$REF_RUBY_VERSION"
          python3 bootstraptest/measure.py plan --ruby-src .ruby-tests \
            --output measurement-plan/bootstrap.json --shards 4 \
            --source-ref "$GITHUB_SHA" --mere-ref "$MERE_REF" --ruby-ref "$RUBY_SOURCE_REF"
          python3 unittest/suite_inventory.py --ruby-src .ruby-tests --output measurement-plan/suites.json
      - uses: actions/upload-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
          retention-days: 7

  corpus:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      binary_sha: ${{ steps.ready.outputs.binary_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      # Release downloads can return HTTP 504 before compilation. Retry setup
      # once; a second failure still fails the job and prevents the build.
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: "5.1"
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the measurement binary at O2
        run: sh tools/build.sh
      - name: Record binary provenance
        run: python3 unittest/ci.py build-info --compiler .mere-compiler --output build-info.json
      - name: Check deferred string-page compaction
        run: python3 unittest/string_page_compact_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: mere-ruby-macos
          path: |
            mere-ruby
            .build_mode
            build-info.json
          include-hidden-files: true
          retention-days: 7
      - id: ready
        run: echo "binary_sha=$(shasum -a 256 mere-ruby | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check bounded argument-marker allocations
        run: python3 unittest/argument_marker_check.py
      - name: Check bounded Fiber scheduler handoffs and shutdown
        run: python3 unittest/fiber_scheduler_check.py
      - name: Check generated UnicodeNormalize tables
        run: sh tools/unicode_normalize_check.sh
      - name: Check record hygiene
        run: sh mspec/record_hygiene.sh
      - name: Check actual Psych scalar and class-loader protocols
        run: sh tools/psych_scalar_check.sh
      - name: Check IO read deadlines with an outer time limit
        run: python3 unittest/io_timeout_check.py
      - name: Check addressed UDP with bounded children
        run: python3 unittest/udp_datagram_check.py
      - name: Check TCP resolver lifecycle and deadlines
        run: |
          python3 unittest/socket_glue_check.py
          python3 unittest/tcp_connect_check.py
      - name: Compare every corpus program
        run: sh run_corpus.sh
      - name: Check temporary scope reuse on success and exceptions
        run: python3 unittest/scratch_scope_check.py
      - name: Check YAML store round trips and graph scaling
        run: |
          sh tools/yaml_store_check.sh
          python3 unittest/yaml_graph_check.py
      - name: Check large zlib and gzip interoperability
        run: python3 unittest/zlib_compression_check.py
      - name: Check tmpdir and FileUtils load orders
        run: sh tools/tmpdir_fileutils_check.sh

  unittest-reference:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - name: Install reference build dependencies
        run: brew install autoconf automake libtool pkgconf openssl@3 libyaml
      - name: Install pinned Rust for the reference JITs
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rust_bin=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          echo "UNITTEST_RUST_BIN=$rust_bin" >> "$GITHUB_ENV"
      - name: Build reference Ruby including test-only C extensions
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: sh unittest/build_reference.sh .ruby-tests "$GITHUB_WORKSPACE/.reference-ruby"
      - name: Prepare checksum-pinned Unicode data and RubyGems fixtures
        run: python3 unittest/test_data.py .ruby-tests
      - name: Record reference provenance and package its runtime
        run: |
          python3 unittest/ci.py reference-info --ruby-src .ruby-tests \
            --binary .reference-ruby/bin/ruby --output reference-build.json
          archive=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("LIBRUBY_A")')
          tar -czf reference-runtime.tar.gz .reference-ruby .ruby-tests/.ext \
            .ruby-tests/Makefile ".ruby-tests/$archive" .ruby-tests/enc/unicode/data .ruby-tests/exe/gem
      - name: Check actual Unicode assertions and Rust gem builds
        run: |
          python3 unittest/environment_smoke.py --ruby-src .ruby-tests \
            --binary .reference-ruby/bin/ruby --output reference-environment-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-environment-smoke
          path: reference-environment-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Check actual mkmf compilation and subprocess context
        run: |
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          reference="$GITHUB_WORKSPACE/.reference-ruby/bin/ruby"
          source="$GITHUB_WORKSPACE/.ruby-tests"
          cd .ruby-tests/test/mkmf
          for test in test_have_func.rb test_configuration.rb; do
            "$reference" -I "$source/.unittest-reference" -I "$source/lib" \
              -I "$source/tool/lib" -I "$source/test" -r test/unit "$test" -v --seed=1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-reference-macos
          path: |
            reference-runtime.tar.gz
            reference-build.json
          retention-days: 7

  unittest-shards:
    name: CRuby tests / shard ${{ matrix.shard }}
    needs: [unittest-plan, corpus, unittest-reference]
    # Corpus differences do not suppress the measurement after a successful
    # upload. A failed build still cannot supply an unrelated binary.
    if: ${{ !cancelled() && needs.corpus.outputs.binary_sha != '' && needs.unittest-reference.result == 'success' && needs.unittest-plan.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unittest-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
      - name: Ensure native reference runtime dependencies
        run: brew install openssl@3 libyaml
      - name: Install pinned Rust for gem extension tests
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rust_bin=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          echo "UNITTEST_RUST_BIN=$rust_bin" >> "$GITHUB_ENV"
      - name: Restore exact binaries and native test extensions
        run: |
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          echo "$GITHUB_WORKSPACE/.reference-ruby/bin" >> "$GITHUB_PATH"
          echo "REF_RUBY_BIN=$GITHUB_WORKSPACE/.reference-ruby/bin/ruby" >> "$GITHUB_ENV"
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Measure partition with independent wall and RSS limits
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -c 0
          python3 unittest/ci.py run --ruby-src .ruby-tests \
            --plan measurement-plan/manifest.json --build-info build-info.json \
            --reference-info reference-build.json --shard "$SHARD" \
            --output "measurement/shard-$SHARD" --wall 600 --rss-kb 2097152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittest-shard-${{ matrix.shard }}
          path: measurement
          if-no-files-found: warn
          retention-days: 7

  unittest-summary:
    needs: [unittest-plan, unittest-shards]
    if: ${{ always() && needs.unittest-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: unittest-shard-*
          path: shard-results
      - name: Collect every planned file including interrupted shards
        if: always()
        run: |
          python3 unittest/ci.py merge --plan measurement-plan/manifest.json \
            --input shard-results --output measurement-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittest-report
          path: measurement-report
          if-no-files-found: warn
          retention-days: 7

  bootstrap-shards:
    name: Bootstrap tests / shard ${{ matrix.shard }}
    needs: [unittest-plan, corpus, unittest-reference]
    if: ${{ !cancelled() && needs.corpus.outputs.binary_sha != '' && needs.unittest-reference.result == 'success' && needs.unittest-plan.result == 'success' }}
    runs-on: macos-26
    # Nine files per shard, two 600-second sides each, plus setup/upload.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
      - name: Restore the exact reference runtime
        run: |
          brew install openssl@3 libyaml
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Run every upstream bootstrap assertion with bounded process families
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -c 0
          python3 bootstraptest/measure.py run --ruby-src .ruby-tests \
            --plan measurement-plan/bootstrap.json --build-info build-info.json \
            --reference-info reference-build.json --binary mere-ruby \
            --reference .reference-ruby/bin/ruby --shard "$SHARD" \
            --output "bootstrap-measurement/shard-$SHARD" --wall 600 --rss-kb 2097152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-shard-${{ matrix.shard }}
          path: bootstrap-measurement
          if-no-files-found: warn
          retention-days: 7

  bootstrap-summary:
    needs: [unittest-plan, bootstrap-shards]
    if: ${{ always() && needs.unittest-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-shard-*
          path: bootstrap-results
      - name: Collect all planned bootstrap source files
        if: always()
        run: |
          python3 bootstraptest/measure.py merge --plan measurement-plan/bootstrap.json \
            --input bootstrap-results --output bootstrap-report
          cat bootstrap-report/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-report
          path: bootstrap-report
          if-no-files-found: warn
          retention-days: 7

  basic-measurement:
    needs: [unittest-plan, corpus, unittest-reference]
    if: ${{ !cancelled() && needs.corpus.outputs.binary_sha != '' && needs.unittest-reference.result == 'success' && needs.unittest-plan.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
      - name: Restore the exact reference runtime
        run: |
          brew install openssl@3 libyaml
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
      - name: Measure the original basic body through its upstream runner
        run: |
          ulimit -c 0
          python3 basictest/measure.py --ruby-src .ruby-tests \
            --plan measurement-plan/manifest.json --suites measurement-plan/suites.json \
            --build-info build-info.json --reference-info reference-build.json \
            --binary mere-ruby --reference .reference-ruby/bin/ruby \
            --output basic-report --wall 600 --rss-kb 2097152
          cat basic-report/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basic-report
          path: basic-report
          if-no-files-found: warn
          retention-days: 7

  tool-shards:
    name: Tool tests / shard ${{ matrix.shard }}
    needs: [unittest-plan, corpus, unittest-reference]
    if: ${{ !cancelled() && needs.corpus.outputs.binary_sha != '' && needs.unittest-reference.result == 'success' && needs.unittest-plan.result == 'success' }}
    runs-on: macos-26
    # Twelve files, two 600-second sides each, plus setup/upload.
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
      - name: Restore the exact reference runtime
        run: |
          brew install openssl@3 libyaml
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Measure original tool bodies and their CLI children
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -c 0
          python3 tooltest/measure.py measure --ruby-src .ruby-tests \
            --plan measurement-plan/manifest.json --suites measurement-plan/suites.json \
            --build-info build-info.json --reference-info reference-build.json \
            --binary mere-ruby --reference .reference-ruby/bin/ruby \
            --shard "$SHARD" --shards 1 --output "tool-measurement/shard-$SHARD" \
            --wall 600 --rss-kb 2097152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-shard-${{ matrix.shard }}
          path: tool-measurement
          if-no-files-found: warn
          retention-days: 7

  tool-summary:
    needs: [tool-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tool-shard-*
          path: tool-results
      - name: Collect every planned tool file, retaining interrupted sides
        if: always()
        run: |
          python3 tooltest/measure.py collect --input tool-results --output tool-report
          cat tool-report/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-report
          path: tool-report
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      # Keep the same bounded setup retry as the macOS build above.
      - uses: ocaml/setup-ocaml@v3
        id: setup-ocaml
        continue-on-error: true
        with:
          ocaml-compiler: "5.1"
      - name: Retry OCaml setup after a failed attempt
        if: steps.setup-ocaml.outcome == 'failure'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build mere-ruby on Linux
        run: sh tools/build.sh
      - name: Check bounded argument-marker allocations
        run: |
          ulimit -s 524288
          python3 unittest/argument_marker_check.py
      - name: Check C nesting headroom
        run: MR_C=mr.c sh tools/bracket_depth_check.sh
      - name: Check temporary scope reuse on success and exceptions
        run: |
          ulimit -s 524288
          python3 unittest/scratch_scope_check.py
      - name: Check deferred string-page compaction
        run: python3 unittest/string_page_compact_check.py
      - name: Smoke test
        run: |
          ulimit -s 524288
          echo 'puts [1,2,3].map { |x| x * 2 }.inspect' > /tmp/t.rb
          out=$(./mere-ruby /tmp/t.rb)
          [ "$out" = "[2, 4, 6]" ] || { echo "got [$out]"; exit 1; }
