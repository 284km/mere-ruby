name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mere_ref:
        description: Full published Mere commit SHA (default is the pinned compiler)
        type: string
        required: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin both dependencies so a moved result is about mere-ruby. A published
  # Mere improvement can be selected through workflow_dispatch.
  MERE_REF: ${{ inputs.mere_ref || '255e8e26dfad203568692874b57bcf7148e8a901' }}
  RUBY_SOURCE_REF: 3e93b23afcec3433f6aecc34b5d832799d754238
  REF_RUBY_VERSION: "4.0.9"
  RUST_VERSION: "1.85.0"

jobs:
  unittest-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-framework
          sparse-checkout: tool/lib
          persist-credentials: false
      - run: python3 unittest/harness_check.py -v
      - run: python3 unittest/transcript_check.py -v
      - run: python3 unittest/test_data_check.py -v
      - run: python3 unittest/process_family_check.py -v
      - name: Test CI collection and real Test::Unit diagnostics
        run: |
          export UNITTEST_REAL_RUBY="$(ruby -rrbconfig -e 'print RbConfig.ruby')"
          export UNITTEST_REAL_TOOL_LIB="$GITHUB_WORKSPACE/.ruby-framework/tool/lib"
          python3 unittest/ci_check.py -v
          python3 unittest/reference_check.py -v

  unittest-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - id: plan
        name: Inventory every test file and partition it once
        run: |
          python3 unittest/ci.py plan --ruby-src .ruby-tests --output measurement-plan \
            --shards 64 --source-ref "$GITHUB_SHA" --mere-ref "$MERE_REF" \
            --ruby-ref "$RUBY_SOURCE_REF" --ruby-version "$REF_RUBY_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
          retention-days: 7

  corpus:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      binary_sha: ${{ steps.ready.outputs.binary_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build the measurement binary at O2
        run: sh tools/build.sh
      - name: Record binary provenance
        run: python3 unittest/ci.py build-info --compiler .mere-compiler --output build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: mere-ruby-macos
          path: |
            mere-ruby
            .build_mode
            build-info.json
          include-hidden-files: true
          retention-days: 7
      - id: ready
        run: echo "binary_sha=$(shasum -a 256 mere-ruby | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check record hygiene
        run: sh mspec/record_hygiene.sh
      - name: Compare every corpus program
        run: sh run_corpus.sh

  unittest-reference:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.REF_RUBY_VERSION }}
      - name: Install reference build dependencies
        run: brew install autoconf automake libtool pkgconf openssl@3 libyaml
      - name: Install pinned Rust for the reference JITs
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rust_bin=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          echo "UNITTEST_RUST_BIN=$rust_bin" >> "$GITHUB_ENV"
      - name: Build reference Ruby including test-only C extensions
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: sh unittest/build_reference.sh .ruby-tests "$GITHUB_WORKSPACE/.reference-ruby"
      - name: Prepare checksum-pinned Unicode data and RubyGems fixtures
        run: python3 unittest/test_data.py .ruby-tests
      - name: Record reference provenance and package its runtime
        run: |
          python3 unittest/ci.py reference-info --ruby-src .ruby-tests \
            --binary .reference-ruby/bin/ruby --output reference-build.json
          archive=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("LIBRUBY_A")')
          tar -czf reference-runtime.tar.gz .reference-ruby .ruby-tests/.ext \
            .ruby-tests/Makefile ".ruby-tests/$archive" .ruby-tests/enc/unicode/data .ruby-tests/exe/gem
      - name: Check actual Unicode assertions and Rust gem builds
        run: |
          python3 unittest/environment_smoke.py --ruby-src .ruby-tests \
            --binary .reference-ruby/bin/ruby --output reference-environment-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-environment-smoke
          path: reference-environment-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Check actual mkmf compilation and subprocess context
        run: |
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          reference="$GITHUB_WORKSPACE/.reference-ruby/bin/ruby"
          source="$GITHUB_WORKSPACE/.ruby-tests"
          cd .ruby-tests/test/mkmf
          for test in test_have_func.rb test_configuration.rb; do
            "$reference" -I "$source/.unittest-reference" -I "$source/lib" \
              -I "$source/tool/lib" -I "$source/test" -r test/unit "$test" -v --seed=1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-reference-macos
          path: |
            reference-runtime.tar.gz
            reference-build.json
          retention-days: 7

  unittest-shards:
    name: CRuby tests / shard ${{ matrix.shard }}
    needs: [unittest-plan, corpus, unittest-reference]
    # Corpus differences do not suppress the measurement after a successful
    # upload. A failed build still cannot supply an unrelated binary.
    if: ${{ !cancelled() && needs.corpus.outputs.binary_sha != '' && needs.unittest-reference.result == 'success' && needs.unittest-plan.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unittest-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ruby/ruby
          ref: ${{ env.RUBY_SOURCE_REF }}
          path: .ruby-tests
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          name: mere-ruby-macos
      - uses: actions/download-artifact@v4
        with:
          name: ruby-reference-macos
      - name: Ensure native reference runtime dependencies
        run: brew install openssl@3 libyaml
      - name: Install pinned Rust for gem extension tests
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rust_bin=$(dirname "$(rustup which --toolchain "$RUST_VERSION" rustc)")
          echo "UNITTEST_RUST_BIN=$rust_bin" >> "$GITHUB_ENV"
      - name: Restore exact binaries and native test extensions
        run: |
          chmod +x mere-ruby
          tar -xzf reference-runtime.tar.gz
          .reference-ruby/bin/ruby unittest/prepare_reference.rb .ruby-tests
          echo "$GITHUB_WORKSPACE/.reference-ruby/bin" >> "$GITHUB_PATH"
          echo "REF_RUBY_BIN=$GITHUB_WORKSPACE/.reference-ruby/bin/ruby" >> "$GITHUB_ENV"
          arch=$(.reference-ruby/bin/ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("arch")')
          echo "UNITTEST_REF_EXT_PATH=$GITHUB_WORKSPACE/.ruby-tests/.ext/$arch" >> "$GITHUB_ENV"
      - name: Measure partition with independent wall and RSS limits
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ulimit -c 0
          python3 unittest/ci.py run --ruby-src .ruby-tests \
            --plan measurement-plan/manifest.json --build-info build-info.json \
            --reference-info reference-build.json --shard "$SHARD" \
            --output "measurement/shard-$SHARD" --wall 600 --rss-kb 2097152
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittest-shard-${{ matrix.shard }}
          path: measurement
          if-no-files-found: warn
          retention-days: 7

  unittest-summary:
    needs: [unittest-plan, unittest-shards]
    if: ${{ always() && needs.unittest-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unittest-plan
          path: measurement-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: unittest-shard-*
          path: shard-results
      - name: Collect every planned file including interrupted shards
        if: always()
        run: |
          python3 unittest/ci.py merge --plan measurement-plan/manifest.json \
            --input shard-results --output measurement-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittest-report
          path: measurement-report
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: merelang/mere
          ref: ${{ env.MERE_REF }}
          path: .mere-compiler
          persist-credentials: false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - name: Build the pinned Mere compiler
        working-directory: .mere-compiler
        run: |
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe
      - name: Build mere-ruby on Linux
        run: sh tools/build.sh
      - name: Check C nesting headroom
        run: MR_C=mr.c sh tools/bracket_depth_check.sh
      - name: Smoke test
        run: |
          ulimit -s 524288
          echo 'puts [1,2,3].map { |x| x * 2 }.inspect' > /tmp/t.rb
          out=$(./mere-ruby /tmp/t.rb)
          [ "$out" = "[2, 4, 6]" ] || { echo "got [$out]"; exit 1; }
